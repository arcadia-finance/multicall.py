name: Test Python Installation Methods

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-install:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"

      - name: uv pip install .
        run: |
          uv venv
          uv pip install .
          uv run --no-sync python -W error -c "import multicall"

      - name: uv pip install -e .
        run: |
          uv pip install -e .
          uv run --no-sync python -W error -c "import multicall"

      - name: Build wheel and install
        run: |
          uv build --wheel
          uv pip install --reinstall dist/*.whl
          uv run --no-sync python -W error -c "import multicall"
