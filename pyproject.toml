[project]
name = "multicall"
version = "0.16.0"
description = "aggregate results from multiple ethereum contract calls"
readme = "readme.md"
requires-python = ">=3.14"
authors = [{ name = "banteg" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.14.3",
    "eth-abi>=6.0.0",
    "eth-hash>=0.8.0",
    "eth-typing>=6.0.0",
    "eth-utils>=6.0.0",
    "requests>=2.34.2",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "joblib>=1.6.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multicall*"]

[tool.setuptools.package-data]
multicall = ["py.typed"]

[tool.uv]
exclude-newer = "4 weeks"
exclude-newer-package = { aiohttp = "2026-10-06T00:00:00Z", certifi = "2026-10-21T00:00:00Z" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = ["error"]
