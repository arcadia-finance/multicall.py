[project]
name = "multicall"
version = "0.16.2"
description = "aggregate results from multiple ethereum contract calls"
readme = "readme.md"
requires-python = ">=3.14"
authors = [{ name = "banteg" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "aiohttp>=3.14.5",
    "eth-abi>=6.0.0",
    "eth-hash>=0.8.0",
    "eth-retry @ git+https://github.com/arcadia-finance/eth_retry.git@5249e48a0cdeb5bc6862bc98dccd7ddbee663568",
    "eth-typing>=6.0.0",
    "eth-utils>=6.0.0",
    "requests>=2.34.2",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "joblib>=1.6.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["multicall*"]

[tool.setuptools.package-data]
multicall = ["py.typed"]

[tool.uv]
exclude-newer = "4 weeks"
exclude-newer-package = { aiohttp = "5 days", bitarray = "5 days", certifi = "1 day", charset-normalizer = "5 days", cytoolz = "5 days", idna = "5 days", iniconfig = "5 days", multidict = "5 days", pluggy = "5 days", propcache = "5 days", pycryptodome = "5 days", pydantic = "5 days", pydantic-core = "5 days", pyunormalize = "5 days", regex = "5 days", ruff = "5 days", toolz = "5 days", websockets = "5 days" }

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = ["error"]
