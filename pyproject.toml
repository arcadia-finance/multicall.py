[project]
name = "multicall"
description = "aggregate results from multiple ethereum contract calls"
requires-python = ">=3.10,<4"
authors = [{ name = "banteg" }]
dynamic = ["version", "dependencies", "readme"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[tool.setuptools.packages.find]
include = ["multicall*"]

[tool.setuptools.dynamic.readme]
file = "readme.md"

[tool.poetry]
version = "0.15.1"

[tool.poetry.dependencies]
python = ">=3.10,<4"
cchecksum = ">=0.0.3,<1"
eth-abi = ">=5.0.1,<6"
# These web3.py versions have a busted async provider and cannot be used in any multithreaded applications
web3 = ">=5.27,!=5.29.*,!=5.30.*,!=5.31.0,!=5.31.1,!=5.31.2"
eth_retry = ">=0.3.5"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
ruff = ">=0.3.5"
joblib = ">=1.2"
aiohttp = "3.14.4"
types-requests = "2.33.0.20260712"
tomli = { version = "2.2.1", python = "<3.11" }

[build-system]
requires = [
    "setuptools", 
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]
